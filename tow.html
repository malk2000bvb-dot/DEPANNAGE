<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الديبانور - استقبال الطلبات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2196F3;
            text-align: center;
            margin-bottom: 20px;
        }
        .order-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .order-card h3 {
            margin-top: 0;
            color: #333;
        }
        .order-card p {
            margin: 8px 0;
            color: #555;
        }
        .accept-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .accept-btn:hover {
            background-color: #45a049;
        }
        .no-orders {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>لوحة طلبات الديباناج الحية</h2>
        <p style="text-align: center; color: #666;">الطلبات الواردة من السائقين:</p>

        <div id="ordersList">
            <!-- سيتم تعبئة الطلبات هنا أوتوماتيكياً -->
        </div>

        <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>

    <script>
        const ordersList = document.getElementById('ordersList');
        
        // جلب الطلبات من ذاكرة المتصفح
        let orders = JSON.parse(localStorage.getItem('depannage_orders')) || [];

        if (orders.length === 0) {
            ordersList.innerHTML = '<div class="no-orders">لا توجد طلبات جديدة حالياً.</div>';
        } else {
            ordersList.innerHTML = '';
            orders.forEach((order, index) => {
                ordersList.innerHTML += 
                    <div class="order-card">
                        <h3>طلب رقم #${index + 1}</h3>
                        <p><strong>اسم السائق:</strong> ${order.name}</p>
                        <p><strong>رقم الهاتف:</strong> ${order.phone}</p>
                        <p><strong>نوع العطب:</strong> ${order.carType}</p>
                        <p><strong>المكان:</strong> ${order.location}</p>
                        <p><strong>وقت الطلب:</strong> ${order.time}</p>
                        <button class="accept-btn" onclick="alert('تم قبول طلب السائق ${order.name} بنجاح!')">قبول الطلب</button>
                    </div>
                ;
            });
        }
    </script>
</body>
</html>
