<script>
        document.getElementById('whatsappForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // استخراج المعلومات
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const carType = document.getElementById('car-type').value;
            const location = document.getElementById('location').value;

            // رقم الهاتف تاعك (تأكد بلي راك حاطه برمز الجزائر بدون الصفر الأول، مثال: 21355xxxxxxx)
            const ownerPhone = "213770363068"; 

            // صياغة الرسالة
            const message = سلام، عندي عطب في السيارة وأحتاج ديباناج:%0a +
                            👤 الاسم: ${name}%0a +
                            📞 الهاتف: ${phone}%0a +
                            🔧 العطب: ${carType}%0a +
                            📍 المكان: ${location};

            // رابط الواتساب المباشر
            const whatsappURL = https://wa.me/${ownerPhone}?text=${message};

            // التوجيه المباشر للصفحة (يمنع المشكل تاع المتصفح لي يحبس الـ Pop-up)
            window.location.href = whatsappURL;
        });
    </script>
