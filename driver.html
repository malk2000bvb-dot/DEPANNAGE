<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب ديبانور - السائق</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #ff9800;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background-color: #ff9800;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #e68900;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>طلب مساعدة (ديباناج)</h2>
        <form onsubmit="event.preventDefault(); alert('تم إرسال طلبك بنجاح! جاري البحث عن أقرب ديبانور...');">
            
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" required placeholder="أدخل اسمك هنا">

            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" required placeholder="مثال: 0550000000">

            <label for="car-type">نوع العطب:</label>
            <select id="car-type">
                <option value="battery">مشكل في البطارية</option>
                <option value="tire">عطب في العجلة (پريڤ)</option>
                <option value="engine">عطب في المحرك / توقف مفاجئ</option>
                <option value="accident">حادث مروري / اصطدام</option>
            </select>

            <label for="location">مكانك الحالي (الولاية / الحي):</label>
            <input type="text" id="location" required placeholder="مثال: الجزائر العاصمة - باب الزوار">

            <button type="submit" class="btn">إرسال طلب النجدة</button>
        </form>

        <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>

</body>
</html>
