<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الديباناج - ديبانور</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            color: #fff;
            transition: 0.3s;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }
        .driver-btn {
            background-color: #ff9800;
        }
        .driver-btn:hover {
            background-color: #e68900;
        }
        .tow-btn {
            background-color: #2196F3;
        }
        .tow-btn:hover {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مرحباً بك في منصة الديباناج السريع</h2>
        <p>اختر نوع الحساب أو الخدمة للبدء:</p>

        <!-- زر السائق -->
        <button class="btn driver-btn" onclick="alert('مرحباً بك كزبون! قريباً سنفتح لك صفحة طلب الديباناج.')">أنا سائق (أحتاج مساعدة / ديبانور)</button>

        <!-- زر الديبانور -->
        <button class="btn tow-btn" onclick="alert('مرحباً بك يا ديبانور! قريباً سنفتح لك لوحة استقبال الطلبات.')">أنا ديبانور (أريد استقبال الطلبات)</button>
    </div>

</body>
</html>
